<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>WC Betting Bakchodi</title>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#0b1612"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Bakchodi"/>
<link rel="apple-touch-icon" href="/icon.svg"/>
<style>
  :root{
    --ink:#0b1612;--panel:#11211b;--panel2:#16291f;--line:#274034;--line2:#345244;
    --txt:#ece6d6;--mut:#8aa090;--gold:#e8b23a;--mint:#62c79a;--red:#e5533c;
    --mono:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0;background:var(--ink);overflow-x:hidden}
  body{font-family:var(--sans);color:var(--txt);-webkit-font-smoothing:antialiased;line-height:1.45;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  .wrap{max-width:860px;margin:0 auto;padding:0 calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left))}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}
  header.bar{position:sticky;top:0;z-index:20;background:rgba(11,22,18,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .bar .wrap{display:flex;align-items:center;gap:8px;padding:11px 16px;min-width:0}
  .logo{font-family:var(--mono);font-weight:700;letter-spacing:.06em;font-size:14px;flex-shrink:0}
  .logo b{color:var(--gold)}
  .who{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
  .pill{font-family:var(--mono);font-size:12px;border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:6px 12px;white-space:nowrap}
  .pill .left{color:var(--mint)}
  .pill .nm{display:inline-block;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
  nav.tabs{border-bottom:1px solid var(--line)}
  nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav.tabs .wrap::-webkit-scrollbar{display:none}
  .tab{background:none;border:none;color:var(--mut);font-size:13px;padding:14px 13px;border-bottom:2px solid transparent;font-family:var(--mono);letter-spacing:.03em;white-space:nowrap;flex-shrink:0}
  .tab.on{color:var(--txt);border-bottom-color:var(--gold)}
  section{padding-top:20px}
  h2.sec{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:0 0 12px}
  .fx{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
  .fx-top{display:flex;align-items:baseline;gap:10px}
  .stage{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
  .teams{font-size:18px;font-weight:600;margin:3px 0 0}
  .ko{margin-left:auto;text-align:right}
  .cd{font-family:var(--mono);font-size:12px;color:var(--mut)} .cd.soon{color:var(--gold)} .cd.live{color:var(--red)}
  .locked-tag{font-family:var(--mono);font-size:10px;color:var(--red);letter-spacing:.1em}
  .mkt{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
  .mkt-h{font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.06em;margin-bottom:8px;display:flex;gap:8px}
  .mkt-h .res{color:var(--mint)}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;display:flex;flex-direction:column;gap:2px;min-width:80px;max-width:100%;align-items:flex-start;color:var(--txt)}
  .opt:hover:not(:disabled){border-color:var(--gold)} .opt:disabled{opacity:.4;cursor:default}
  .opt .ol{font-size:12px;line-height:1.25;overflow-wrap:anywhere} .opt .od{font-family:var(--mono);font-size:15px;color:var(--gold);font-weight:600}
  .opt.win{border-color:var(--mint)} .opt.win .od{color:var(--mint)}
  .opts.list{flex-direction:column;flex-wrap:nowrap}
  .opts.list .opt{flex-direction:row;width:100%;min-width:0;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px}
  .opts.list .opt .ol{flex:1;min-width:0} .opts.list .opt .od{flex-shrink:0}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .ticket{background:#f5efe0;color:#1c241f;width:100%;max-width:380px;border-radius:12px;overflow:hidden;box-shadow:0 -8px 40px rgba(0,0,0,.5)}
  .tk-h{background:#1c241f;color:#f5efe0;padding:12px 16px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between}
  .tk-b{padding:16px}
  .perf{height:0;border-top:2px dashed #c9bfa6;margin:8px 0;position:relative}
  .perf::before,.perf::after{content:"";position:absolute;top:-9px;width:16px;height:16px;background:var(--ink);border-radius:50%}
  .perf::before{left:-24px}.perf::after{right:-24px}
  .tk-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:#3a463e}
  .tk-row b{color:#1c241f;font-family:var(--mono)}
  .tk-pick{font-size:17px;font-weight:700;margin-bottom:6px}
  .stake-in{display:flex;gap:8px;align-items:center;margin:10px 0}
  .stake-in input{flex:1;font-family:var(--mono);font-size:16px;padding:10px 12px;border-radius:8px;border:1px solid #c9bfa6;background:#fff;color:#1c241f}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .chip{font-family:var(--mono);font-size:12px;border:1px solid #c9bfa6;background:#fff;border-radius:999px;padding:5px 10px;color:#3a463e}
  .ret{font-family:var(--mono);font-size:22px;font-weight:700}
  .tk-actions{display:flex;gap:8px;margin-top:12px}
  .btn{flex:1;border:none;border-radius:9px;padding:12px;font-size:14px;font-weight:600}
  .btn-go{background:var(--gold);color:#1c241f} .btn-x{background:#e3dac6;color:#3a463e}
  .lb{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .lb-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .lb-row:last-child{border-bottom:none} .lb-row.me{background:var(--panel2)}
  .lb-row>div{min-width:0}
  .rank{font-family:var(--mono);font-size:13px;color:var(--mut);width:22px;flex-shrink:0} .rank.r1{color:var(--gold)}
  .lb-name{font-weight:600;overflow-wrap:anywhere} .lb-rec{font-family:var(--mono);font-size:11px;color:var(--mut)}
  .lb-net{font-family:var(--mono);font-size:16px;text-align:right;flex-shrink:0} .up{color:var(--mint)} .down{color:var(--red)}
  .bet{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .bet>div{min-width:0}
  .b-pick{font-size:14px;font-weight:600;overflow-wrap:anywhere} .b-sub{font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:2px;overflow-wrap:anywhere}
  .b-stat{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line2);flex-shrink:0}
  .b-stat.pending{color:var(--gold);border-color:var(--gold)} .b-stat.won{color:var(--mint);border-color:var(--mint)} .b-stat.lost{color:var(--red);border-color:var(--red)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  label.fld{display:block;font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.06em;margin:10px 0 5px}
  input.in,select.in{width:100%;font-family:var(--mono);font-size:14px;background:var(--ink);color:var(--txt);border:1px solid var(--line2);border-radius:8px;padding:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mini{background:var(--gold);color:#1c241f;border:none;border-radius:8px;padding:10px 14px;font-weight:600;font-size:13px}
  .mini.ghost{background:none;border:1px solid var(--line2);color:var(--txt)}
  .opt-row{display:flex;gap:8px;margin-bottom:6px} .opt-row input{flex:1}
  .share-bar{display:flex;gap:8px;margin-bottom:14px}
  .share{font-family:var(--mono);font-size:12px;background:var(--panel2);border:1px solid var(--line2);color:var(--txt);border-radius:9px;padding:9px 12px}
  .hint{font-size:12px;color:var(--mut);margin:6px 0 0} .empty{color:var(--mut);font-size:14px;text-align:center;padding:40px 0;font-family:var(--mono)}
  .action-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .action-col{flex:1;min-width:90px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
  .action-col-head{font-family:var(--mono);font-size:11px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
  .action-col-head>span:first-child{min-width:0;overflow-wrap:anywhere;line-height:1.2}
  .action-col-head .ao{color:var(--gold);font-weight:600;flex-shrink:0}
  .action-item{font-size:13px;font-weight:600;padding:3px 0;display:flex;justify-content:space-between;align-items:baseline}
  .action-item.mine{color:var(--gold)}
  .action-item .aps{font-family:var(--mono);font-size:11px;color:var(--mut);font-weight:400}
  /* stats / visualisations */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;min-width:0}
  .stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
  .stat .v{font-family:var(--mono);font-weight:700;font-size:22px;margin-top:6px;overflow-wrap:anywhere;line-height:1.1}
  .stat .s{font-size:11px;color:var(--mut);margin-top:3px;overflow-wrap:anywhere}
  .viz{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:16px}
  .viz h3{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:0 0 14px;font-weight:600}
  .dbar{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .dbar-name{width:62px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:13px}
  .dbar-track{flex:1;position:relative;height:18px;background:var(--panel2);border-radius:5px;min-width:0}
  .dbar-track::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)}
  .dbar-fill{position:absolute;top:2px;bottom:2px;border-radius:4px;max-width:50%}
  .dbar-fill.pos{left:50%;background:var(--mint)} .dbar-fill.neg{right:50%;background:var(--red)}
  .dbar-val{width:50px;flex-shrink:0;text-align:right;font-family:var(--mono);font-size:13px}
  .wr{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .wr-name{width:62px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:13px}
  .wr-track{flex:1;height:18px;background:var(--panel2);border-radius:5px;overflow:hidden;min-width:0}
  .wr-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--mint));border-radius:5px;min-width:2px}
  .wr-val{width:74px;flex-shrink:0;text-align:right;font-family:var(--mono);font-size:11px;color:var(--mut)}
  .legend{display:flex;flex-wrap:wrap;gap:9px 12px;margin-top:13px}
  .legend span{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;color:var(--mut)}
  .legend i{width:9px;height:9px;border-radius:2px;flex-shrink:0}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1c241f;font-weight:600;font-size:13px;padding:11px 18px;border-radius:10px;z-index:60;max-width:90%;text-align:center}
  .gate{max-width:360px;margin:80px auto;text-align:center;padding:0 16px}
  .splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:var(--ink);z-index:80;padding:env(safe-area-inset-top) 16px 0}
  .splash .logo{font-family:var(--mono);font-weight:700;letter-spacing:.08em;font-size:17px}
  .splash .logo b{color:var(--gold)}
  .spinner{width:34px;height:34px;border:3px solid var(--line2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sp-txt{font-family:var(--mono);font-size:12px;color:var(--mut);letter-spacing:.08em}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}.teams{font-size:16px}.tab{padding:13px 11px;font-size:12px}.logo{font-size:13px}}
  @media(max-width:380px){.pill .pl-k{display:none}.pill{padding:6px 11px}}
</style>
<script src="/config.js"></script>
</head>
<body>
<div id="app"><div class="splash"><div class="logo">WC BETTING <b>BAKCHODI</b></div><div class="spinner"></div><div class="sp-txt">loading…</div></div></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const { SUPABASE_URL, SUPABASE_ANON_KEY, FUNCTIONS_BASE, ROOM_CODE } = window.__CONFIG || {};
if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
  document.getElementById("app").innerHTML =
    '<div class="gate"><h2 class="sec">Config missing</h2><p class="hint">Set SUPABASE_URL, SUPABASE_ANON_KEY and ROOM_CODE in Netlify env vars, then redeploy.</p></div>';
  throw new Error("missing config");
}

const sbc = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById("app");

let pool=null, players=[], fixtures=[], bets=[], standings=[];
let me=null, tab="matches", slip=null, adminTok=null, betFilter="all";

async function loadAll(){
  const { data:p } = await sbc.from("pools").select("*").eq("room_code",ROOM_CODE).single();
  pool = p;
  if(!pool){ app.innerHTML = `<div class="gate"><h2 class="sec">No pool "${ROOM_CODE}"</h2><p class="hint">Run schema.sql and check the room code in this file.</p></div>`; return; }
  const [pl,fx,bt,st] = await Promise.all([
    sbc.from("players").select("*").eq("pool_id",pool.id).order("name"),
    sbc.from("fixtures").select("*, markets(*)").eq("pool_id",pool.id).order("commence_time"),
    sbc.from("bets").select("*").eq("pool_id",pool.id),
    sbc.from("standings").select("*").eq("pool_id",pool.id),
  ]);
  players=pl.data||[]; fixtures=fx.data||[]; bets=bt.data||[]; standings=st.data||[];
  const saved=localStorage.getItem("wc26me_"+ROOM_CODE);
  if(saved && (saved==="bookie" || players.find(x=>x.id===saved))) me=saved;
  if(!me){
    const urlTok=new URLSearchParams(location.search).get("t");
    if(urlTok){
      const match=players.find(p=>p.token===urlTok);
      if(match){ me=match.id; localStorage.setItem("wc26me_"+ROOM_CODE,match.id); history.replaceState(null,"",location.pathname); }
    }
  }
  render();
}
function setMe(id){ me=id; localStorage.setItem("wc26me_"+ROOM_CODE,id); render(); }

/* total staked by current player for a matchday (informational only — no cap) */
function staked(matchday){ return bets.filter(b=>b.player_id===me && b.matchday===matchday).reduce((s,b)=>s+Number(b.stake),0); }
function housePnl(){ return -standings.reduce((s,r)=>s+Number(r.net),0); }
function locked(fx){ return Date.now() >= new Date(fx.commence_time).getTime(); }
function cd(t){
  const ms=new Date(t)-Date.now();
  if(ms<=0) return {txt:"KICKED OFF",cls:"live"};
  const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);
  return {txt:"closes in "+(d>0?`${d}d ${h}h ${m}m`:h>0?`${h}h ${m}m ${s}s`:`${m}m ${s}s`),cls:ms<36e5?"soon":""};
}

async function placeBet(stake){
  const {fx,mkt,opt}=slip;
  const { data, error } = await sbc.rpc("place_bet",
    { p_player:me, p_market:mkt.id, p_option:opt.key, p_stake:stake });
  if(error){ toast(error.message.replace(/^.*?:\s/,"")); return; }
  const placed={opt,stake};
  slip=null; render();
  toast(`✓ ${placed.opt.label} @${Number(placed.opt.odds).toFixed(2)} · ${Number(placed.stake).toFixed(0)} pts`);
  loadAll();
}

async function adminCall(payload){
  const r = await fetch(`${FUNCTIONS_BASE}/admin`,{method:"POST",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify({...payload, token:adminTok})});
  if(!r.ok){ toast("Admin: "+(await r.text())); return false; }
  await loadAll(); return true;
}

/* ----------------------------- render ----------------------------- */
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function render(){
  if(!pool) return;
  if(!me){ renderGate(); return; }
  const sy=window.scrollY;
  app.innerHTML="";
  app.appendChild(header());
  app.appendChild(tabs());
  const main=el(`<div class="wrap"></div>`);
  ({matches:vMatches,overall:vOverall,mybets:vMyBets,table:vTable,stats:vStats,action:vAction,admin:vAdmin}[tab])(main);
  app.appendChild(main);
  if(slip) app.appendChild(slipEl());
  startTick();
  if(sy) requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,sy)));
}
function renderGate(){
  app.innerHTML="";
  const g=el(`<div class="gate">
    <div class="logo" style="font-size:18px;margin-bottom:24px">WC BETTING <b>BAKCHODI</b></div>
    <h2 class="sec">Enter your access code</h2>
    <p class="hint" style="margin-bottom:16px">Your bookie shared a unique code or link — paste the code below.</p>
    <div class="opt-row">
      <input class="in" id="tokIn" placeholder="e.g. a3f8d2c1" style="letter-spacing:0.08em;text-transform:lowercase" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
      <button class="mini" id="tokGo">Go</button>
    </div>
    <p class="hint" id="tokErr" style="color:var(--red);min-height:18px;margin-top:8px"></p>
  </div>`);
  const tryToken=()=>{
    const tok=g.querySelector("#tokIn").value.trim().toLowerCase();
    const match=players.find(p=>p.token===tok);
    if(match){ setMe(match.id); }
    else g.querySelector("#tokErr").textContent="Code not recognised — check with your bookie";
  };
  g.querySelector("#tokGo").onclick=tryToken;
  g.querySelector("#tokIn").onkeydown=e=>{ if(e.key==="Enter") tryToken(); };
  const bkDiv=el(`<div style="margin-top:28px;border-top:1px solid var(--line);padding-top:18px">
    <p class="hint" style="margin:0 0 10px;text-align:center">Running the pool?</p>
    <button class="mini" id="asbookie" style="width:100%;background:transparent;border:1px solid var(--gold);color:var(--gold)">👑 Continue as Bookie</button>
  </div>`);
  bkDiv.querySelector("#asbookie").onclick=()=>setMe("bookie");
  g.appendChild(bkDiv);
  app.appendChild(g);
}
function header(){
  const today=new Date().toISOString().slice(0,10);
  const isBookie=me==="bookie";
  const hn=housePnl();
  const pillHtml=isBookie
    ?`<span class="pl-k">house P&L</span> <span class="left num" style="color:${hn>=0?"var(--mint)":"var(--red)"}">${hn>=0?"+":""}${hn.toFixed(0)}</span>`
    :`<span class="pl-k">staked today</span> <span class="left num">${staked(today).toFixed(0)}</span>`;
  const playerName=isBookie?"👑 Bookie":(players.find(p=>p.id===me)?.name||"");
  const h=el(`<header class="bar"><div class="wrap">
    <span class="logo">WC <b>BAKCHODI</b></span>
    <div class="who">
      <span class="pill">${pillHtml}</span>
      <span class="pill" style="display:inline-flex;align-items:center;gap:8px">
        <span class="nm">${playerName}</span>
        <button id="logout" style="background:none;border:none;color:var(--mut);font-size:18px;line-height:1;padding:0;cursor:pointer" title="Log out">×</button>
      </span>
    </div></div></header>`);
  h.querySelector("#logout").onclick=()=>{ me=null; localStorage.removeItem("wc26me_"+ROOM_CODE); render(); };
  return h;
}
function tabs(){
  const t=[["matches","Matches"],["overall","Overall"],["mybets","My bets"],["table","Table"],["stats","Stats"],["action","Action"],["admin","Admin"]];
  const n=el(`<nav class="tabs"><div class="wrap">${t.map(([k,l])=>`<button class="tab ${tab===k?"on":""}" data-tab="${k}">${l}</button>`).join("")}</div></nav>`);
  n.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});

function balanceChart(stat){
  const viz=el(`<div class="viz"><h3>📈 Balance progression</h3></div>`);
  const settled=bets.filter(b=>b.status==="won"||b.status==="lost")
    .slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  if(settled.length<2){ viz.appendChild(el(`<div class="empty" style="padding:18px 0">Not enough settled bets yet to chart a trend.</div>`)); return viz; }

  const t0=new Date(settled[0].created_at).getTime();
  const t1=new Date(settled[settled.length-1].created_at).getTime();
  const span=Math.max(1,t1-t0);
  const colorOf={},nameOf={}; stat.forEach(p=>{colorOf[p.id]=p.color;nameOf[p.id]=p.name;});

  // cumulative realised P&L per player, in time order
  const series={},run={};
  stat.forEach(p=>{ series[p.id]=[{t:t0,y:0}]; run[p.id]=0; });
  settled.forEach(b=>{
    if(!series[b.player_id]){ series[b.player_id]=[{t:t0,y:0}]; run[b.player_id]=0; }
    run[b.player_id]+=b.status==="won"?profitOf(b):-Number(b.stake);
    series[b.player_id].push({t:new Date(b.created_at).getTime(),y:run[b.player_id]});
  });
  // extend each line flat to the right edge
  Object.values(series).forEach(pts=>{ const last=pts[pts.length-1]; if(last.t<t1) pts.push({t:t1,y:last.y}); });

  let yMin=0,yMax=0;
  Object.values(series).forEach(pts=>pts.forEach(pt=>{ if(pt.y<yMin)yMin=pt.y; if(pt.y>yMax)yMax=pt.y; }));
  if(yMin===yMax){ yMin-=1; yMax+=1; }
  const padY=(yMax-yMin)*0.12; yMin-=padY; yMax+=padY;

  const W=320,H=180,L=6,R=6,TP=8,BT=8;
  const X=t=>L+(t-t0)/span*(W-L-R);
  const Y=v=>TP+(yMax-v)/(yMax-yMin)*(H-TP-BT);
  const z=Y(0).toFixed(1);

  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;height:auto">`;
  svg+=`<line x1="${L}" y1="${z}" x2="${W-R}" y2="${z}" style="stroke:#345244" stroke-width="1" stroke-dasharray="3 3"/>`;
  Object.entries(series).forEach(([id,pts])=>{
    if(pts.length<2) return;
    const c=colorOf[id]||"#8aa090";
    const d=pts.map((pt,i)=>`${i?"L":"M"}${X(pt.t).toFixed(1)} ${Y(pt.y).toFixed(1)}`).join(" ");
    svg+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const lp=pts[pts.length-1];
    svg+=`<circle cx="${X(lp.t).toFixed(1)}" cy="${Y(lp.y).toFixed(1)}" r="2.6" fill="${c}"/>`;
  });
  svg+=`</svg>`;
  viz.appendChild(el(svg));

  const finals=Object.entries(series).map(([id,pts])=>({name:nameOf[id]||"?",y:pts[pts.length-1].y,color:colorOf[id]||"#8aa090"}))
    .sort((a,b)=>b.y-a.y);
  viz.appendChild(el(`<div class="legend">${finals.map(f=>`<span><i style="background:${f.color}"></i>${f.name} ${f.y>=0?"+":""}${f.y.toFixed(0)}</span>`).join("")}</div>`));
  return viz;
}

  }
  // settlement + odds sync
  const settleCard=el(`<div class="card"><h2 class="sec">API actions</h2>
    <p class="hint" style="margin-bottom:10px">Settlement: pulls final scores and settles all completed h2h + totals markets. Run after each match ends.</p>
    <button class="mini" id="do-settle" style="width:100%">⚡ Run settlement now</button>
    <p class="hint" id="settle-res" style="margin-top:6px;min-height:14px"></p>
    <p class="hint" style="margin:12px 0 10px;border-top:1px solid var(--line);padding-top:12px">Odds sync: fetches upcoming fixtures + latest odds from The Odds API. New markets only — existing posted lines are never overwritten.</p>
    <button class="mini ghost" id="do-sync" style="width:100%">↻ Re-fetch odds</button>
    <p class="hint" id="sync-res" style="margin-top:6px;min-height:14px"></p></div>`);
  settleCard.querySelector("#do-settle").onclick=async()=>{
    const btn=settleCard.querySelector("#do-settle"), res=settleCard.querySelector("#settle-res");
    btn.textContent="Running…"; btn.disabled=true;
    try{
      const r=await fetch(`${FUNCTIONS_BASE}/settle?token=${adminTok}`);
      const j=await r.json().catch(()=>({}));
      res.textContent=r.ok
        ?`Done — ${j.settled_markets} market${j.settled_markets===1?"":"s"} settled · ${j.credits_remaining} API credits left`
        :`Error ${r.status} — check Netlify logs`;
      if(r.ok) loadAll();
    }catch(e){ res.textContent=String(e); }
    btn.textContent="⚡ Run settlement now"; btn.disabled=false;
  };
  settleCard.querySelector("#do-sync").onclick=async()=>{
    const btn=settleCard.querySelector("#do-sync"), res=settleCard.querySelector("#sync-res");
    btn.textContent="Fetching…"; btn.disabled=true;
    try{
      const r=await fetch(`${FUNCTIONS_BASE}/sync-odds?token=${adminTok}`);
      const j=await r.json().catch(()=>({}));
      res.textContent=r.ok
        ?`Done — ${j.events} events · ${j.new_markets} new markets · ${j.credits_remaining} API credits left`
        :`Error ${r.status} — check Netlify logs`;
      if(r.ok) loadAll();
    }catch(e){ res.textContent=String(e); }
    btn.textContent="↻ Re-fetch odds"; btn.disabled=false;
  };
  // WC winner outright market
  settleCard.appendChild(el(`<p class="hint" style="margin:12px 0 10px;border-top:1px solid var(--line);padding-top:12px">WC Winner: creates an outright winner market with the top 10 favourites at pre-set odds. Betting locks at Round of 16 (2 Jul). Run again to update the team list as sides are knocked out. Settle manually at the end.</p>`));
  settleCard.appendChild(el(`<button class="mini ghost" id="do-outrights" style="width:100%">🏆 Create WC Winner market</button>`));
  settleCard.appendChild(el(`<p class="hint" id="outrights-res" style="margin-top:6px;min-height:14px"></p>`));
  settleCard.appendChild(el(`<p class="hint" style="margin:8px 0 10px">Tournament props: adds 7 Polymarket-inspired yes/no bets (Neymar, Ronaldo, Messi, Trump). Betting locks at WC Final. Settle each by hand. Safe to re-run — skips already-created markets.</p>`));
  settleCard.appendChild(el(`<button class="mini ghost" id="do-props" style="width:100%">🎭 Create Tournament Props</button>`));
  settleCard.appendChild(el(`<p class="hint" id="props-res" style="margin-top:6px;min-height:14px"></p>`));
  settleCard.querySelector("#do-props").onclick=async()=>{
    const btn=settleCard.querySelector("#do-props"), res=settleCard.querySelector("#props-res");
    btn.textContent="Creating…"; btn.disabled=true;
    try{
      const r=await fetch(`${FUNCTIONS_BASE}/admin`,{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({action:"create_tournament_props",token:adminTok})});
      const txt=await r.text();
      const j=(()=>{try{return JSON.parse(txt);}catch{return {};}})();
      res.textContent=r.ok
        ?`Done — ${j.created} created, ${j.skipped} already existed`
        :`Error ${r.status}: ${txt}`;
      if(r.ok) loadAll();
    }catch(e){ res.textContent=String(e); }
    btn.textContent="🎭 Create Tournament Props"; btn.disabled=false;
  };
  settleCard.querySelector("#do-outrights").onclick=async()=>{
    const btn=settleCard.querySelector("#do-outrights"), res=settleCard.querySelector("#outrights-res");
    btn.textContent="Fetching…"; btn.disabled=true;
    try{
      const r=await fetch(`${FUNCTIONS_BASE}/admin`,{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({action:"sync_wc_winner",token:adminTok})});
      const txt=await r.text();
      const j=(()=>{try{return JSON.parse(txt);}catch{return {};}})();
      res.textContent=r.ok
        ?`${j.created?"Created":"Already exists"} — top ${j.teams} teams · ${j.credits_remaining} API credits left`
        :`Error ${r.status}: ${txt||"check Netlify logs"}`;
      if(r.ok) loadAll();
    }catch(e){ res.textContent=String(e); }
    btn.textContent="🏆 Fetch WC Winner odds"; btn.disabled=false;
  };
  s.appendChild(settleCard);
  // player access links
  const linksCard=el(`<div class="card"><h2 class="sec">Player access links</h2>
    <p class="hint" style="margin-bottom:12px">Share each player's unique link — they tap it once and are logged in automatically on that device.</p>
  </div>`);
  players.forEach(p=>{
    const link=p.token?`${location.origin}/?t=${p.token}`:null;
    const row=el(`<div class="lb-row" style="flex-wrap:wrap;gap:8px;padding:12px 0">
      <span style="font-weight:600;min-width:70px">${p.name}</span>
      <code class="num" style="font-size:11px;color:var(--gold);flex:1;word-break:break-all">${link||"no code yet"}</code>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button class="mini" data-copy style="${link?"":"opacity:.4;pointer-events:none"}">Copy</button>
        <button class="mini ghost" data-regen>New code</button>
      </div>
    </div>`);
    if(link) row.querySelector("[data-copy]").onclick=async()=>{ await navigator.clipboard.writeText(link); toast(`Copied link for ${p.name}`); };
    row.querySelector("[data-regen]").onclick=async()=>{ if(await adminCall({action:"update_player_token",player_id:p.id})) toast(`New code for ${p.name}`); };
    linksCard.appendChild(row);
  });
  s.appendChild(linksCard);
  // create custom market
  const c=el(`<div class="card"><h2 class="sec">Add a fun bet</h2>
    <label class="fld">Match</label><select class="in" id="cm_fx">${fixtures.map(f=>`<option value="${f.id}">${f.home} v ${f.away}</option>`).join("")}</select>
    <label class="fld">Type</label><select class="in" id="cm_key"><option value="custom">Custom prop (settle by hand)</option><option value="btts">Both teams to score (auto)</option><option value="cs">Correct score (auto)</option></select>
    <label class="fld">Question</label><input class="in" id="cm_label" placeholder="e.g. Red card in the match?">
    <label class="fld">Options (label · odds · key)</label><div id="cm_opts">
      <div class="opt-row"><input class="in" value="Yes"><input class="in" type="number" step="0.01" value="2.0" style="max-width:80px"><input class="in" value="yes" style="max-width:80px"></div>
      <div class="opt-row"><input class="in" value="No"><input class="in" type="number" step="0.01" value="1.7" style="max-width:80px"><input class="in" value="no" style="max-width:80px"></div></div>
    <button class="mini ghost" id="cm_add" style="margin-top:4px">+ option</button>
    <button class="mini" id="cm_save" style="margin-top:12px;width:100%">Create market</button>
    <p class="hint">For "Correct score (auto)", use option keys like 1-0, 2-1 and add an "other" key as catch-all.</p></div>`);
  c.querySelector("#cm_add").onclick=()=>c.querySelector("#cm_opts").appendChild(
    el(`<div class="opt-row"><input class="in" placeholder="label"><input class="in" type="number" step="0.01" placeholder="odds" style="max-width:80px"><input class="in" placeholder="key" style="max-width:80px"></div>`));
  c.querySelector("#cm_save").onclick=async()=>{
    const key=c.querySelector("#cm_key").value;
    const outcomes=[...c.querySelectorAll("#cm_opts .opt-row")].map(r=>{const [l,o,k]=r.querySelectorAll("input");
      return {key:(k.value||l.value).trim().toLowerCase(),label:l.value.trim(),odds:parseFloat(o.value)||2};}).filter(o=>o.label);
    if(outcomes.length<2) return toast("Need 2+ options");
    const badOdds=outcomes.find(o=>o.odds<1.01);
    if(badOdds) return toast(`Odds for "${badOdds.label}" must be ≥ 1.01 (decimal format — e.g. 1.5 means +50% profit)`);
    const ok=await adminCall({action:"create_market",fixture_id:c.querySelector("#cm_fx").value,
      key,label:c.querySelector("#cm_label").value.trim()||"Prop",outcomes});
    if(ok) toast("Market created");
  };
  // trending prop presets — click fills the form, adjust odds then hit Create
  const PRESETS=[
    {q:"🟥 Red card in the match?",        opts:[{l:"Yes",o:4.50,k:"yes"},{l:"No",o:1.18,k:"no"}]},
    {q:"⚽ Goal in first 10 minutes?",      opts:[{l:"Yes",o:2.80,k:"yes"},{l:"No",o:1.40,k:"no"}]},
    {q:"🎯 Penalty kick in this match?",    opts:[{l:"Yes",o:2.00,k:"yes"},{l:"No",o:1.80,k:"no"}]},
    {q:"📺 VAR overturns a decision?",      opts:[{l:"Yes",o:2.60,k:"yes"},{l:"No",o:1.50,k:"no"}]},
    {q:"📋 3+ bookings in the match?",      opts:[{l:"Yes",o:2.10,k:"yes"},{l:"No",o:1.70,k:"no"}]},
    {q:"🔄 Come-from-behind winner?",       opts:[{l:"Yes",o:3.50,k:"yes"},{l:"No",o:1.25,k:"no"}]},
    {q:"🏃 Winning margin exactly 1 goal?", opts:[{l:"Yes",o:2.40,k:"yes"},{l:"No",o:1.55,k:"no"}]},
    {q:"💤 Goalless draw (0-0)?",           opts:[{l:"Yes",o:5.00,k:"yes"},{l:"No",o:1.15,k:"no"}]},
    {q:"🎪 4+ goals in the match?",         opts:[{l:"Yes",o:3.20,k:"yes"},{l:"No",o:1.32,k:"no"}]},
    {q:"👟 Goalscorer also gets booked?",   opts:[{l:"Yes",o:4.00,k:"yes"},{l:"No",o:1.22,k:"no"}]},
    {q:"🌍 Host nation scores first?",      opts:[{l:"Yes",o:1.90,k:"yes"},{l:"No",o:1.90,k:"no"}]},
    {q:"🧤 Home goalkeeper saves 5+?",      opts:[{l:"Yes",o:3.00,k:"yes"},{l:"No",o:1.38,k:"no"}]},
  ];
  const pd=el(`<div style="border-bottom:1px dashed var(--line);padding-bottom:14px;margin-bottom:2px"><label class="fld" style="margin-top:0">Trending props — click to fill form below</label><div style="display:flex;flex-wrap:wrap;gap:5px"></div></div>`);
  const ptgt=pd.querySelector("div");
  PRESETS.forEach(p=>{
    const btn=el(`<button class="chip" style="font-size:11px;padding:4px 9px">${p.q}</button>`);
    btn.onclick=()=>{
      c.querySelector("#cm_label").value=p.q;
      const od=c.querySelector("#cm_opts"); od.innerHTML="";
      p.opts.forEach(o=>od.appendChild(el(`<div class="opt-row"><input class="in" value="${o.l}"><input class="in" type="number" step="0.01" value="${o.o}" style="max-width:80px"><input class="in" value="${o.k}" style="max-width:80px"></div>`)));
    };
    ptgt.appendChild(btn);
  });
  c.insertBefore(pd, c.querySelector("label.fld"));
  s.appendChild(c);
  // manual settle (non-auto open markets)
  const manual=[]; fixtures.forEach(fx=>(fx.markets||[]).forEach(m=>{ if(m.result===null && m.auto===false) manual.push({fx,m}); }));
  const ms=el(`<div class="card"><h2 class="sec">Settle props by hand</h2></div>`);
  if(!manual.length) ms.appendChild(el(`<p class="hint">Nothing waiting. Standard markets auto-settle from the score.</p>`));
  manual.forEach(({fx,m})=>{
    const row=el(`<div style="margin-top:10px"><div class="b-sub">${fx.home} v ${fx.away}</div><label class="fld">${m.label} — winner</label><div class="opts"></div></div>`);
    m.outcomes.forEach(o=>{ const b=el(`<button class="opt"><span class="ol">${o.label}</span></button>`);
      b.onclick=async()=>{ if(await adminCall({action:"settle_market",market_id:m.id,result:o.key})) toast("Settled"); };
      row.querySelector(".opts").appendChild(b); });
    ms.appendChild(row);
  });
  s.appendChild(ms);
  main.appendChild(s);
}

/* countdown + polling */
let tickT;
function startTick(){ clearInterval(tickT); tickT=setInterval(()=>{
  document.querySelectorAll("[data-cd]").forEach(e=>{const r=cd(e.dataset.cd);e.textContent=r.txt;e.className="cd "+r.cls;});
},1000); }
setInterval(()=>{ if(!slip) loadAll(); }, 20000); // refresh from server

let toastT; function toast(msg){ const o=document.querySelector(".toast"); if(o)o.remove();
  const e=el(`<div class="toast">${msg}</div>`); document.body.appendChild(e); clearTimeout(toastT); toastT=setTimeout(()=>e.remove(),2600); }

loadAll();

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/sw.js").catch(()=>{});
}
</script>
</body>
</html>
